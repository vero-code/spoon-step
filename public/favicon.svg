<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Subtle glow filter -->
    <filter id="spoonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glowing cyan/teal gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>

  <!-- Dark rounded card background matching the logo -->
  <rect x="8" y="8" width="112" height="112" rx="32" fill="#17171a" stroke="#26262b" stroke-width="2" />

  <!-- Spoon Graphic with Glow -->
  <g filter="url(#spoonGlow)">
    <!-- Elegant Spoon Silhouette -->
    <path
      d="M 64 24
         C 50 24 42 34 42 47
         C 42 59 52 67 58 74
         C 60 76 61 80 61 88
         L 61 100
         C 58 103 57 106 57 110
         C 57 115 60 118 64 118
         C 68 118 71 115 71 110
         C 71 106 70 103 67 100
         L 67 88
         C 67 80 68 76 70 74
         C 76 67 86 59 86 47
         C 86 34 78 24 64 24 Z"
      fill="url(#tealGrad)"
    />
  </g>

  <!-- 3 Steps cut into the spoon bowl (Spoon + Step) -->
  <!-- Step 1: Bottom step -->
  <rect x="52" y="55" width="12" height="4" rx="2" fill="#17171a" />
  <!-- Step 2: Middle step -->
  <rect x="59" y="47" width="12" height="4" rx="2" fill="#17171a" />
  <!-- Step 3: Top step -->
  <rect x="66" y="39" width="12" height="4" rx="2" fill="#17171a" />
</svg>